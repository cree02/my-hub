<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chris & James — Ledger</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>

  <!-- ══════════════════════════════════════════════════════
       STEP 1: Replace the placeholder values below with
       your actual Firebase project config.
       See setup instructions in the README comment at the
       bottom of this file.
  ═══════════════════════════════════════════════════════ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyD04tBNer0L6EWTCSXpYOCDOY086boiYdU",
      authDomain:        "chris-james-ledger.firebaseapp.com",
      databaseURL:       "https://chris-james-ledger-default-rtdb.firebaseio.com",
      projectId:         "chris-james-ledger",
      storageBucket:     "chris-james-ledger.firebasestorage.app",
      messagingSenderId: "58582575060",
      appId:             "1:58582575060:web:0a006b1d2c7c332fbbd841"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
    const txRef = ref(db, "transactions");

    const ME   = "Chris";
    const THEM = "James";
    const CATEGORIES = ["📱 Cell Phone","🍔 Food","⛽ Gas","🛒 Groceries","🎉 Entertainment","💸 Other"];

    let allTransactions = [];
    let currentFilter = "All";

    // ── Helpers ──────────────────────────────────────────
    const fmt = (n) => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Math.abs(n));
    const fmtDate = (iso) => new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});

    // ── DOM refs ─────────────────────────────────────────
    const balanceAmt  = document.getElementById("balance-amt");
    const balanceLbl  = document.getElementById("balance-lbl");
    const txList      = document.getElementById("tx-list");
    const statusDot   = document.getElementById("status-dot");
    const statusTxt   = document.getElementById("status-txt");
    const filterBar   = document.getElementById("filter-bar");
    const modal       = document.getElementById("modal");
    const addBtn      = document.getElementById("add-btn");
    const cancelBtn   = document.getElementById("cancel-btn");
    const submitBtn   = document.getElementById("submit-btn");
    const paidBtns    = document.querySelectorAll(".paid-toggle");

    // ── Filter pills ──────────────────────────────────────
    ["All",...CATEGORIES].forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "filter-pill" + (cat === "All" ? " active" : "");
      btn.textContent = cat;
      btn.addEventListener("click", () => {
        currentFilter = cat;
        document.querySelectorAll(".filter-pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render();
      });
      filterBar.appendChild(btn);
    });

    // ── Render ────────────────────────────────────────────
    function render() {
      // Balance
      const balance = allTransactions.reduce((acc,t) =>
        t.paidBy === ME ? acc + parseFloat(t.amount) : acc - parseFloat(t.amount), 0);

      balanceAmt.style.color = balance > 0 ? "#4ade80" : balance < 0 ? "#f87171" : "#94a3b8";
      balanceAmt.textContent = balance === 0 ? "—" : fmt(balance);
      balanceLbl.textContent = balance > 0
        ? `${THEM} owes you ${fmt(balance)}`
        : balance < 0
        ? `You owe ${THEM} ${fmt(balance)}`
        : "You're all square!";

      // List
      const filtered = currentFilter === "All"
        ? allTransactions
        : allTransactions.filter(t => t.category === currentFilter);

      if (filtered.length === 0) {
        txList.innerHTML = `<div class="empty">${currentFilter==="All"
          ? "No transactions yet — add the first one."
          : "No transactions in this category."}</div>`;
        return;
      }

      txList.innerHTML = `
        <div class="tx-header">
          <span>Date</span><span>Description</span>
          <span style="text-align:right">Amount</span>
          <span style="text-align:center">Paid By</span>
          <span></span>
        </div>`;

      filtered.forEach((t,i) => {
        const row = document.createElement("div");
        row.className = "tx-row";
        row.innerHTML = `
          <span class="tx-date">${fmtDate(t.date)}</span>
          <div class="tx-desc">
            <div class="tx-desc-main">${t.description}</div>
            <div class="tx-desc-sub">${t.category}${t.note ? " · "+t.note : ""}</div>
          </div>
          <span class="tx-amt" style="color:${t.paidBy===ME?"#4ade80":"#60a5fa"}">${fmt(t.amount)}</span>
          <span class="tx-paid">${t.paidBy}</span>
          <button class="del-btn" data-id="${t.firebaseKey}">×</button>`;
        txList.appendChild(row);
      });

      document.querySelectorAll(".del-btn").forEach(btn => {
        btn.addEventListener("click", () => deleteTx(btn.dataset.id));
      });
    }

    // ── Firebase listeners ────────────────────────────────
    onValue(txRef, (snap) => {
      allTransactions = [];
      snap.forEach(child => {
        allTransactions.push({ ...child.val(), firebaseKey: child.key });
      });
      // Newest first
      allTransactions.sort((a,b) => new Date(b.date) - new Date(a.date) || b.firebaseKey.localeCompare(a.firebaseKey));
      render();
      setStatus(true);
    }, () => setStatus(false));

    function setStatus(ok) {
      statusDot.style.background = ok ? "#4ade80" : "#f87171";
      statusTxt.textContent = ok ? "Live" : "Offline";
    }

    // ── Add transaction ───────────────────────────────────
    let selectedPaidBy = ME;

    paidBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        selectedPaidBy = btn.dataset.who;
        paidBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    addBtn.addEventListener("click", () => { modal.style.display="flex"; });
    cancelBtn.addEventListener("click", () => { modal.style.display="none"; clearForm(); });
    modal.addEventListener("click", e => { if(e.target===modal){ modal.style.display="none"; clearForm(); } });

    submitBtn.addEventListener("click", async () => {
      const date = document.getElementById("f-date").value;
      const desc = document.getElementById("f-desc").value.trim();
      const amt  = parseFloat(document.getElementById("f-amt").value);
      const cat  = document.getElementById("f-cat").value;
      const note = document.getElementById("f-note").value.trim();

      if (!date || !desc || isNaN(amt) || amt <= 0) {
        alert("Please fill in date, description, and a valid amount.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving...";
      try {
        await push(txRef, { date, description: desc, amount: amt.toFixed(2), paidBy: selectedPaidBy, category: cat, note });
        modal.style.display = "none";
        clearForm();
      } catch(e) {
        alert("Failed to save. Check your Firebase config.");
      }
      submitBtn.disabled = false;
      submitBtn.textContent = "Add Transaction";
    });

    async function deleteTx(key) {
      if (!confirm("Remove this transaction?")) return;
      await remove(ref(db, "transactions/"+key));
    }

    function clearForm() {
      document.getElementById("f-date").value = new Date().toISOString().split("T")[0];
      document.getElementById("f-desc").value = "";
      document.getElementById("f-amt").value  = "";
      document.getElementById("f-note").value = "";
      document.getElementById("f-cat").value  = CATEGORIES[0];
      selectedPaidBy = ME;
      paidBtns.forEach((b,i) => { b.classList.toggle("active", i===0); });
    }

    // Set today's date on load
    document.getElementById("f-date").value = new Date().toISOString().split("T")[0];
    paidBtns[0].classList.add("active");
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0f1a;
      --surface: #0d1526;
      --card:    #0f172a;
      --border:  #1e293b;
      --border2: #334155;
      --muted:   #475569;
      --dim:     #64748b;
      --text:    #e2e8f0;
      --subtle:  #94a3b8;
      --blue:    #3b82f6;
      --blue-lt: #60a5fa;
      --green:   #4ade80;
      --red:     #f87171;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 24px 28px;
    }
    .header-inner {
      max-width: 720px; margin: 0 auto;
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 16px; flex-wrap: wrap;
    }
    .eyebrow {
      font-size: 10px; color: var(--muted);
      letter-spacing: .15em; text-transform: uppercase; margin-bottom: 4px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 26px; font-weight: 900;
      color: #f8fafc; letter-spacing: -.01em;
    }
    .status {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--dim); margin-top: 6px;
    }
    #status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--border2);
    }

    /* ── Balance card ── */
    .balance-card {
      max-width: 720px; margin: 20px auto 0;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 18px 22px;
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .balance-label { font-size: 10px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
    #balance-amt { font-size: 28px; font-weight: 500; letter-spacing: -.02em; }
    #balance-lbl { font-size: 13px; color: var(--dim); text-align: right; }

    /* ── Content ── */
    .content { max-width: 720px; margin: 0 auto; padding: 24px 28px; }

    /* ── Filter pills ── */
    #filter-bar {
      display: flex; gap: 8px; overflow-x: auto;
      padding-bottom: 4px; margin-bottom: 20px;
    }
    .filter-pill {
      background: transparent; border: 1px solid var(--border2);
      color: var(--dim); padding: 5px 12px; border-radius: 20px;
      cursor: pointer; font-family: 'DM Mono', monospace;
      font-size: 11px; white-space: nowrap;
      transition: all .15s;
    }
    .filter-pill.active { background: var(--card); border-color: var(--blue); color: var(--blue-lt); }

    /* ── Transaction list ── */
    .tx-header {
      display: grid; grid-template-columns: 90px 1fr 84px 72px 24px;
      gap: 12px; padding: 6px 12px;
      font-size: 10px; color: var(--border2);
      letter-spacing: .1em; text-transform: uppercase;
    }
    .tx-row {
      display: grid; grid-template-columns: 90px 1fr 84px 72px 24px;
      gap: 12px; padding: 12px; border-radius: 6px;
      align-items: start; cursor: default;
      transition: background .15s;
    }
    .tx-row:hover { background: rgba(255,255,255,.025); }
    .tx-row:hover .del-btn { opacity: 1; }
    .tx-date { font-size: 11px; color: var(--muted); padding-top: 2px; }
    .tx-desc-main { font-size: 13px; color: #cbd5e1; }
    .tx-desc-sub { font-size: 10px; color: var(--border2); margin-top: 2px; }
    .tx-amt { font-size: 14px; font-weight: 500; text-align: right; padding-top: 2px; }
    .tx-paid {
      font-size: 10px; color: var(--muted); text-align: center;
      background: var(--border); border-radius: 4px;
      padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .del-btn {
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; font-size: 14px; padding: 0 4px;
      border-radius: 4px; opacity: 0; transition: all .15s; line-height: 1.4;
    }
    .del-btn:hover { color: var(--red); background: rgba(248,113,113,.1); }
    .empty {
      text-align: center; color: var(--border2);
      font-size: 13px; padding: 60px 0;
    }
    .legend {
      margin-top: 32px; display: flex; gap: 20px;
      font-size: 11px; color: var(--border2);
    }

    /* ── Buttons ── */
    .btn-primary {
      background: var(--blue); border: none; color: white;
      padding: 10px 20px; border-radius: 6px; cursor: pointer;
      font-family: 'DM Mono', monospace; font-size: 13px;
      letter-spacing: .05em; transition: all .15s;
    }
    .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border2);
      color: var(--subtle); padding: 8px 16px; border-radius: 6px;
      cursor: pointer; font-family: 'DM Mono', monospace;
      font-size: 12px; transition: all .15s;
    }
    .btn-ghost:hover { border-color: var(--muted); color: #cbd5e1; }

    /* ── Modal ── */
    #modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.7); align-items: center;
      justify-content: center; z-index: 100;
      backdrop-filter: blur(4px); padding: 20px;
    }
    .modal-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 28px;
      width: 100%; max-width: 440px;
      box-shadow: 0 25px 50px rgba(0,0,0,.5);
    }
    .modal-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 24px;
    }
    .modal-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 20px; font-weight: 700; color: #f8fafc;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 11px; color: var(--dim);
      letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px;
    }
    .input, .select {
      width: 100%; background: #1e293b; border: 1px solid var(--border2);
      color: var(--text); padding: 9px 12px; border-radius: 6px;
      font-family: 'DM Mono', monospace; font-size: 13px;
      outline: none; transition: border .15s;
    }
    .input:focus, .select:focus { border-color: var(--blue); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .toggle-group { display: flex; }
    .paid-toggle {
      flex: 1; padding: 9px; border: 1px solid var(--border2);
      background: transparent; color: var(--dim); cursor: pointer;
      font-family: 'DM Mono', monospace; font-size: 12px; transition: all .15s;
    }
    .paid-toggle:first-child { border-radius: 6px 0 0 6px; }
    .paid-toggle:last-child  { border-radius: 0 6px 6px 0; border-left: none; }
    .paid-toggle.active { background: #1e3a5f; border-color: var(--blue); color: var(--blue-lt); }
    .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-inner">
      <div>
        <div class="eyebrow">Shared Ledger</div>
        <h1>Chris &amp; James</h1>
        <div class="status">
          <span id="status-dot"></span>
          <span id="status-txt">Connecting…</span>
        </div>
      </div>
      <button class="btn-primary" id="add-btn">+ Add Transaction</button>
    </div>
    <div class="balance-card">
      <div>
        <div class="balance-label">Current Balance</div>
        <div id="balance-amt" style="color:#94a3b8">—</div>
      </div>
      <div id="balance-lbl" style="font-size:13px;color:#64748b">Loading…</div>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div id="filter-bar"></div>
    <div id="tx-list">
      <div class="empty">Connecting to database…</div>
    </div>
    <div class="legend">
      <span><span style="color:#4ade80">■</span> Paid by Chris</span>
      <span><span style="color:#60a5fa">■</span> Paid by James</span>
    </div>
  </div>

  <!-- Add Transaction Modal -->
  <div id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">New Transaction</div>
        <button class="btn-ghost" id="cancel-btn">✕</button>
      </div>

      <div class="two-col">
        <div class="field">
          <label>Date</label>
          <input type="date" class="input" id="f-date"/>
        </div>
        <div class="field">
          <label>Amount ($)</label>
          <input type="number" class="input" id="f-amt" placeholder="0.00" step="0.01" min="0"/>
        </div>
      </div>

      <div class="field">
        <label>Description</label>
        <input type="text" class="input" id="f-desc" placeholder="e.g. Phone bill — April"/>
      </div>

      <div class="field">
        <label>Category</label>
        <select class="select" id="f-cat">
          <option>📱 Cell Phone</option>
          <option>🍔 Food</option>
          <option>⛽ Gas</option>
          <option>🛒 Groceries</option>
          <option>🎉 Entertainment</option>
          <option>💸 Other</option>
        </select>
      </div>

      <div class="field">
        <label>Paid By</label>
        <div class="toggle-group">
          <button class="paid-toggle" data-who="Chris">Chris</button>
          <button class="paid-toggle" data-who="James">James</button>
        </div>
      </div>

      <div class="field">
        <label>Note (optional)</label>
        <input type="text" class="input" id="f-note" placeholder="Any extra context…"/>
      </div>

      <div class="modal-footer">
        <button class="btn-ghost" id="cancel-btn2" onclick="document.getElementById('modal').style.display='none'">Cancel</button>
        <button class="btn-primary" id="submit-btn" style="flex:2">Add Transaction</button>
      </div>
    </div>
  </div>

  <!--
  ════════════════════════════════════════════════════════════
  FIREBASE SETUP — ONE-TIME, TAKES ~5 MINUTES
  ════════════════════════════════════════════════════════════

  1. Go to https://console.firebase.google.com
  2. Click "Add project" → give it any name (e.g. "chris-james-ledger") → Continue
  3. Disable Google Analytics (not needed) → Create project
  4. In the left sidebar click "Build" → "Realtime Database"
  5. Click "Create Database" → choose "United States" → Start in TEST MODE → Enable
  6. Click the gear icon (⚙) → "Project settings"
  7. Scroll to "Your apps" → click the </> (Web) icon → register app (any nickname)
  8. Copy the firebaseConfig object values into the top of this file
     replacing each REPLACE_WITH_YOUR_... placeholder
  9. Save the file, drop it into iCloud Drive, share the iCloud link with James

  That's it — any transaction either of you adds shows up live for the other.
  ════════════════════════════════════════════════════════════
  -->

</body>
</html>
