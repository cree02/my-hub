<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First 101 Guide</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090e1a;
      color: #e2e8f0;
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #0f1927;
      border: 1px solid #1e2d45;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 1.25rem; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; color: #f8fafc; }
    p { color: #64748b; font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .badge {
      display: inline-block;
      background: #1e2d45;
      color: #60a5fa;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
    }
    a {
      display: inline-block;
      margin-top: 2rem;
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.9rem;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📋</div>
    <h1>First 101 Guide</h1>
    <p>This dashboard is currently being built. Check back soon — it will live right here when it's ready.</p>
    <span class="badge">Coming Soon</span>
    <br />
    <a href="../index.html">← Back to Hub</a>
  </div>
</body>
</html>
